<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast 24×7</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s;
        }
        .container {
            flex: 1;
            text-align: center;
            padding: 20px;
            color: #333;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        .search-box {
            margin-bottom: 20px;
        }
        #city-input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #city-input:focus {
            outline: none;
            border-color: #2196F3;
        }
        .button-group {
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #2196F3;
            color: white;
        }
        button:hover {
            background-color: #1565C0;
        }
        #weather-info {
            display: none;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 20px;
            max-width: 600px;
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        #weather-info h2 {
            margin: 0 0 10px;
        }
        #weather-icon {
            width: 100px;
            height: 100px;
        }
        .weather-details p {
            margin: 5px 0;
            font-size: 16px;
        }
        footer {
            text-align: center;
            padding: 10px;
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
        }
        .am {
            background: url('https://i.imgur.com/8Z5kXzM.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
        }
        .pm {
            background: url('https://i.imgur.com/5zKx3rM.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }
        .pm #weather-info {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather Forecast 24×7</h1>
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name">
            <div class="button-group">
                <button onclick="getWeatherByCity()">Get Weather</button>
                <button onclick="getWeatherByLocation()">Use My Location</button>
            </div>
        </div>
        <div id="weather-info">
            <h2 id="city-name"></h2>
            <p id="date-time"></p>
            <img id="weather-icon" src="" alt="Weather Icon">
            <div class="weather-details">
                <p id="temperature"></p>
                <p id="feels-like"></p>
                <p id="description"></p>
                <p id="humidity"></p>
                <p id="wind"></p>
                <p id="pressure"></p>
                <p id="visibility"></p>
                <p id="sunrise"></p>
                <p id="sunset"></p>
            </div>
        </div>
    </div>
    <footer>Powered by sathminofc©</footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script>
        const apiKey = '5df2f5d11845c8ef5c7640dbc30eb1a5'; // Replace with your OpenWeatherMap API key
        const weatherUrl = 'https://api.openweathermap.org/data/2.5/weather';

        // Set background based on time
        function setBackground() {
            const now = new Date();
            const hours = now.getHours();
            document.body.classList.remove('am', 'pm');
            if (hours < 12) {
                document.body.classList.add('am');
            } else {
                document.body.classList.add('pm');
            }
        }
        setBackground();
        setInterval(setBackground, 60000); // Update every minute

        // City autocomplete
        $( "#city-input" ).autocomplete({
            source: function( request, response ) {
                $.ajax({
                    url: "https://api.openweathermap.org/geo/1.0/direct",
                    data: {
                        q: request.term,
                        limit: 5,
                        appid: apiKey
                    },
                    success: function( data ) {
                        response( data.map( item => `${item.name}, ${item.country}` ) );
                    }
                });
            },
            minLength: 2
        });

        // Get weather by city
        async function getWeatherByCity() {
            const city = document.getElementById('city-input').value.split(',')[0];
            if (!city) {
                alert('Please enter a city name');
                return;
            }
            try {
                const response = await fetch(`${weatherUrl}?q=${city}&appid=${apiKey}&units=metric`);
                if (!response.ok) throw new Error('City not found');
                const data = await response.json();
                displayWeather(data);
            } catch (error) {
                alert(error.message);
            }
        }

        // Get weather by current location
        async function getWeatherByLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const { latitude, longitude } = position.coords;
                        try {
                            const response = await fetch(`${weatherUrl}?lat=${latitude}&lon=${longitude}&appid=${apiKey}&units=metric`);
                            const data = await response.json();
                            displayWeather(data);
                        } catch (error) {
                            alert('Error fetching weather data');
                        }
                    },
                    () => alert('Geolocation access denied')
                );
            } else {
                alert('Geolocation is not supported by this browser');
            }
        }

        // Display weather data
        function displayWeather(data) {
            const { name, sys, main, weather, wind, visibility, dt, timezone } = data;
            const date = new Date((dt + timezone) * 1000);
            const options = {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
            };
            document.getElementById('city-name').textContent = `${name}, ${sys.country}`;
            document.getElementById('date-time').textContent = date.toLocaleString('en-US', options);
            document.getElementById('weather-icon').src = `http://openweathermap.org/img/wn/${weather[0].icon}@2x.png`;
            document.getElementById('temperature').textContent = `Temperature: ${main.temp}°C`;
            document.getElementById('feels-like').textContent = `Feels Like: ${main.feels_like}°C`;
            document.getElementById('description').textContent = `Weather: ${weather[0].description}`;
            document.getElementById('humidity').textContent = `Humidity: ${main.humidity}%`;
            document.getElementById('wind').textContent = `Wind: ${wind.speed} m/s, ${wind.deg}°`;
            document.getElementById('pressure').textContent = `Pressure: ${main.pressure} hPa`;
            document.getElementById('visibility').textContent = `Visibility: ${visibility / 1000} km`;
            document.getElementById('sunrise').textContent = `Sunrise: ${new Date((sys.sunrise + timezone) * 1000).toLocaleTimeString('en-US', { hour12: true })}`;
            document.getElementById('sunset').textContent = `Sunset: ${new Date((sys.sunset + timezone) * 1000).toLocaleTimeString('en-US', { hour12: true })}`;
            document.getElementById('weather-info').style.display = 'block';
        }

        // Handle Enter key
        document.getElementById('city-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') getWeatherByCity();
        });
    </script>
</body>
</html>
